name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        # numpy / pandas are needed only by the dataset generators, not by the app
        run: pip install -r backend/requirements.txt numpy pandas
      - name: Generate benchmark datasets (dataset/ is git-ignored)
        run: for f in dataset/syn/*.py; do python "$f"; done
      - name: Pytest
        working-directory: backend
        run: pytest tests -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    # Critical smoke run: built SPA served by a real backend, real dataset files.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt numpy pandas
      - run: for f in dataset/syn/*.py; do python "$f"; done
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend
        run: |
          VIZPILOT_DATA_DIR="$RUNNER_TEMP/vp-e2e" nohup uvicorn app.main:create_app --factory --port 8100 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8100/api/health > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/backend.log"; exit 1
      - name: E2E smoke
        working-directory: frontend
        run: npm run e2e -- --tag ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            frontend/e2e/screenshots/
            ${{ runner.temp }}/backend.log
